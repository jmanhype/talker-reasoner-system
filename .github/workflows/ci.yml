name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install pinned design tools
        run: |
          go install github.com/RamXX/machinery/cmd/machinery@v0.3.11
          go install github.com/stacklok/modelith/cmd/modelith@v0.4.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run Python tests
        run: uv run --group dev pytest -q
      - name: Check TypeScript edge
        run: npx --yes --package typescript@5 tsc -p edge
